# Codemagic configuration for the Gallerista Flutter app in this monorepo.
# Keep this file at the Git repository root (next to backend/, frontend/, gallerista/).
workflows:
  gallerista-ios-testflight:
    name: Gallerista iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    working_directory: gallerista

    # Exact reference name under Codemagic > Team settings > Developer Portal.
    integrations:
      app_store_connect: gallerista

    environment:
      # Public endpoints from gallerista/.env. Never store credentials here.
      vars:
        API_URL: "https://ai-photo-book-moment-backend.wrtsxa.easypanel.host"
        WEB_URL: "https://gallerista.app"
      flutter: stable
      xcode: 26.5
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.gallerista

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Create app environment file
        script: |
          set -eu
          : "${API_URL:?API_URL is missing}"
          : "${WEB_URL:?WEB_URL is missing}"
          # Flutter bundles .env as an asset; do not put private secrets in it.
          printf 'API_URL=%s\nWEB_URL=%s\nSAMPLE_IMAGES=false\n' "$API_URL" "$WEB_URL" > .env

      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Install iOS pods if a Podfile exists
        script: |
          if [ -f ios/Podfile ]; then
            (cd ios && pod install)
          else
            echo "No ios/Podfile; skipping separate pod install."
          fi

      - name: Configure iOS signing
        script: xcode-project use-profiles

      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    # Artifact paths are relative to the cloned Git repository root.
    artifacts:
      - gallerista/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # TestFlight only: never submit automatically for App Store review.
        submit_to_app_store: false
