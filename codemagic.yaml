# Codemagic configuration for the Gallerista Flutter app in this monorepo.
# Keep this file at the Git repository root (next to backend/, frontend/, gallerista/).
workflows:
  gallerista-ios-testflight:
    name: Gallerista iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    working_directory: gallerista

    # Exact reference name under Codemagic > Team settings > Developer Portal.
    integrations:
      app_store_connect: gallerista

    environment:
      # No vars here: the app uses everything from gallerista/.env, which
      # must be committed to the repo (it is bundled into the app, so never
      # put private secrets in it).
      flutter: stable
      xcode: 26.5
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.gallerista

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Check app environment file (gallerista/.env)
        script: |
          set -eu
          if [ ! -f .env ]; then
            echo "ERROR: gallerista/.env is missing. Commit it to the repo:"
            echo "  git add gallerista/.env && git commit -m 'Add app env' && git push"
            exit 1
          fi
          for key in API_URL WEB_URL; do
            if ! grep -Eq "^[[:space:]]*${key}=[^[:space:]]" .env; then
              echo "ERROR: ${key} is missing or empty in gallerista/.env"
              exit 1
            fi
          done
          if grep -Eiq '^[[:space:]]*SAMPLE_IMAGES=true' .env; then
            echo "WARNING: SAMPLE_IMAGES=true in gallerista/.env (dev-only stock photos)."
          fi
          echo "Using gallerista/.env:"
          grep -E '^[[:space:]]*[A-Z_]+=' .env | sed -E 's/=.*/=…/'

      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Install iOS pods if a Podfile exists
        script: |
          if [ -f ios/Podfile ]; then
            (cd ios && pod install)
          else
            echo "No ios/Podfile; skipping separate pod install."
          fi

      - name: Configure iOS signing
        script: xcode-project use-profiles

      - name: Build signed IPA and verify TestFlight artifact
        script: |
          set -euo pipefail
          echo "Flutter project directory: $(pwd)"
          flutter build ipa --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

          # Flutter exports the signed .ipa into build/ios/ipa relative to the app.
          IPA_DIR="$(pwd)/build/ios/ipa"
          echo "Checking for exported IPA in: $IPA_DIR"
          IPA_PATH=""
          if [ -d "$IPA_DIR" ]; then
            IPA_PATH=$(find "$IPA_DIR" -maxdepth 1 -type f -name '*.ipa' -print -quit)
          fi

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA was exported. TestFlight publishing cannot continue."
            echo "iOS build output files:"
            find "$(pwd)/build/ios" -maxdepth 4 -type f -print 2>/dev/null | head -n 80 || true
            exit 1
          fi

          # Use a known absolute artifact directory to avoid monorepo path ambiguity.
          ARTIFACT_DIR="$CM_BUILD_DIR/codemagic_artifacts"
          mkdir -p "$ARTIFACT_DIR"
          cp "$IPA_PATH" "$ARTIFACT_DIR/Gallerista.ipa"
          test -s "$ARTIFACT_DIR/Gallerista.ipa"
          echo "IPA ready for Codemagic artifact collection and TestFlight:"
          ls -lh "$ARTIFACT_DIR/Gallerista.ipa"

    # Absolute path is intentional: scripts run in gallerista/, but Codemagic
    # collects artifacts independently of the script working directory.
    artifacts:
      - $CM_BUILD_DIR/codemagic_artifacts/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # TestFlight only: never submit automatically for App Store review.
        submit_to_app_store: false
