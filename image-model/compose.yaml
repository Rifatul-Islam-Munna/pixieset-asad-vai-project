services:
  insightface-vector-api:
    build: .
    container_name: insightface-vector-api
    restart: unless-stopped
    environment:
      # Keep the current embedding model for existing galleries.
      # Changing model weights requires a separate, rebuilt face index.
      MODEL_NAME: buffalo_s
      MODEL_ROOT: /models

      # Bigger detector + mirror/tile scans catch more small and side faces in group photos.
      DETECTION_SIZE: "960"
      DETECTION_THRESHOLD: "0.20"
      WORKER_COUNT: "1"
      # Heavy face requests wait behind this app-level gate. Health checks do not.
      FACE_REQUEST_CONCURRENCY: "2"
      # Still below normal process priority, but no longer intentionally sleeps
      # as much between detector passes. This speeds large queues without adding
      # another model copy in RAM.
      PROCESS_NICE: "5"
      SCAN_YIELD_MS: "1"
      GROUP_SCAN: "true"
      MIRROR_SCAN: "true"
      TILE_SIZE: "896"
      TILE_OVERLAP: "320"
      MAX_TILES: "48"
      MAX_IMAGE_SIDE: "3200"
      MIN_FACE_SIZE: "6"
      MAX_UPLOAD_MB: "80"
      SOURCE_FETCH_TIMEOUT_SECONDS: "20"

      # Set a long random value. NestJS must send this in the x-api-key header.
      API_KEY: change-this-to-a-long-random-secret

      # Explicit ONNX thread budget; keep other CPU libraries single-threaded.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      ORT_NUM_THREADS: "3"
    volumes:
      # Persists downloaded model files across container restarts.
      - insightface_models:/models
    ports:
      # Safe default: only this VPS can access the API.
      # Your NestJS process on the same VPS calls http://127.0.0.1:8010.
      - "127.0.0.1:8010:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 90s
    mem_limit: 5g
    # Hard CPU quota: even a larger model must stay within three CPU cores.
    cpus: 3.0

volumes:
  insightface_models:
