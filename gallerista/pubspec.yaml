name: gallerista
description: "Gallerista mobile app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking (same setup as Nutshell)
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0
  flutter_dotenv: ^6.0.1

  # Storage + DI + logging
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0
  get_it: ^9.2.1
  logger: ^2.6.2

  # Routing + query cache
  auto_route: ^11.1.0
  cached_query_flutter: ^3.3.6
  cached_storage: ^3.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.12.2
  auto_route_generator: ^10.5.0

flutter:
  uses-material-design: true
  assets:
    - .env
